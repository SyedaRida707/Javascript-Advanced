<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Propagation Example</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        div {
            background-color: antiquewhite;
            padding: 3rem 3rem;
            border: 1px solid black;
            position: relative;
            text-align: center;
        }

        #outer:hover {
            background-color: blue;
            z-index: 1;
        }

        #middle:hover {
            background-color: rgb(0, 217, 255);
            z-index: 2;
        }

        #inner:hover {
            background-color: rgb(149, 255, 0);
            z-index: 3;
        }
    </style>
</head>

<body>
    <div id="outer">
        Outer
        <div id="middle">
            Middle
            <div id="inner">Inner</div>
        </div>
    </div>

    <script>
        // * =================================== 
        // *  Event Propagation: 
        // * ===================================

        // Event propagation refers to the process of how events propagate or travel through the 
        // DOM (Document Object  Model) hierarchy. 

        // In JavaScript, there are two phases of event  propagation: capturing phase and bubbling phase. 
        // nderstanding event propagation is crucial for managing and handling events in complex 
        // web applications. 

        // * =================================== 
        // *  Phases of Event Propagation: 
        // * ===================================

        // ? Capturing Phase:
        // The event starts from the root of the DOM and goes down to the target element.
        // Handlers registered for the capturing phase are executed.

        // ? Target Phase:
        // The event reaches the target element.
        // The handler registered for the target phase is executed.

        // ? Bubbling Phase:
        // The event starts from the target element and bubbles up to the root of the DOM.
        // Handlers registered for the bubbling phase are executed. -->

        // <!--?  event.stopPropagation() -->
        // <!-- The stopPropagation() method of the Event interface prevents further propagation 
        // of the current event 
        //  in the capturing and bubbling phases.

        const outer = (e) => {
            console.table(
                [
                    {
                        Description: "I am the outer one",
                        Target: e.target,
                        CurrentTarget: e.currentTarget,
                    },
                ]
            )
        };
        const middle = (e) => {
            console.table(
                [
                    {
                        Description: "I am the inner one",
                        Target: e.target,
                        CurrentTarget: e.currentTarget,
                    },
                ]
            )
        };
        const inner = (e) => {
            console.table(
                [
                    {
                        Description: "I am the inner one",
                        Target: e.target,
                        CurrentTarget: e.currentTarget,
                    },
                ]
            )
        };
        // By default is the bubbling phase
        // bubbling phase bottom to top travel 
        document.getElementById('outer').addEventListener('click', outer);
        document.getElementById('middle').addEventListener('click', middle);
        document.getElementById('inner').addEventListener('click', inner);

        // To achieve event capturing, you can use the third parameter of the addEventListener method,
        // which specifies whether the event should be captured during the capturing phase. Setting it
        // to true will activate the capturing phase.
        //   document
        //     .getElementById("outer")
        //     .addEventListener("click", callOuter, true);
        //   document
        //     .getElementById("inner")
        //     .addEventListener("click", callInner, true);
        //   document
        //     .getElementById("middle")
        //     .addEventListener("click", callMiddle, true);
    </script>
</body>

</html>
