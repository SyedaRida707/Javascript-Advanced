<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event-delegation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        div {
            background-color: antiquewhite;
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 1rem;
            padding: 10px 10px;
        }

        ul li {
            list-style-type: none;
            border: .1rem solid black;
            margin-bottom: .5rem;
            text-align: center;
            padding: .1rem .5rem;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div>
        <h3> Which technology excites you the most in Full-Stack Development?</h3>
        <ul>
            <li>🧱 HTML5</li>
            <li>🎨 CSS3</li>
            <li>🔀 Git & GitHub</li>
            <li>💎 Bootstrap</li>
            <li>🌬️ Tailwind CSS</li>
            <li>⚡ JavaScript</li>
            <li>🔥 Firebase / Supabase</li>
            <li>⚛️ React.js</li>
            <li>🚂 Express.js</li>
            <li>🟢 Node.js</li>
            <li>▲ Next.js</li>
            <li>🍃 MongoDB</li>
        </ul>
        <p></p>
    </div>

    <script>
        document.getElementsByTagName('ul'). addEventListener('click', (e) => {
         console.log(e.target);
         
        });
    </script>
</body>

</html>
