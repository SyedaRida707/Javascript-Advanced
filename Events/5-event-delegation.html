<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event-delegation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        div {
            background-color: antiquewhite;
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 1rem;
            padding: 10px 10px;
        }

        ul li {
            list-style-type: none;
            border: .1rem solid black;
            margin-bottom: .5rem;
            text-align: center;
            padding: .1rem .5rem;
            cursor: pointer;
            transition: all 0.2s linear;
            &:hover{
                scale: 1.1;
            }
        }
    </style>
</head>

<body>
    <div>
        <h3> Which technology excites you the most in Full-Stack Development?</h3>
        <ul>
            <li>🧱 HTML5</li>
            <li>🎨 CSS3</li>
            <li>🔀 Git & GitHub</li>
            <li>💎 Bootstrap</li>
            <li>🌬️ Tailwind CSS</li>
            <li>⚡ JavaScript</li>
            <li>🔥 Firebase / Supabase</li>
            <li>⚛️ React.js</li>
            <li>🚂 Express.js</li>
            <li>🟢 Node.js</li>
            <li>▲ Next.js</li>
            <li>🍃 MongoDB</li>
        </ul>
        <p></p>
    </div>

    <script>
// =================================== 
//  Event Delegation: 
// ===================================
// Event delegation is a concept in JavaScript where instead of attaching event listeners to individual 
// elements, you attach a single event listener to a common ancestor of those elements. This is particularly 
// useful when you have a large number of similar elements and want to reduce the number of event listeners, 
// improve performance, and simplify code. -->

// Example: List with Delegation -->
// Consider a scenario where you have an unordered list (<ul>) with multiple list items (<li>), and you want 
// to handle click events on each list item. Instead of adding a separate event listener to each list item, 
// you can use event delegation. -->

        document.querySelector('ul').addEventListener('click', (e) => {
            let textli = e.target;

            textli.style.transform = 'rotateY(360deg)';
            setTimeout(() => {
                textli.style.transform = 'rotateY(0deg)';
            }, 500);

            if (e.target.tagName === 'LI') {
                console.log(e.target.tagName);
                let p = document.querySelector('p').innerHTML = `Your tech crush is ${textli.innerText}`;

            };
        });

    </script>
</body>

</html>
