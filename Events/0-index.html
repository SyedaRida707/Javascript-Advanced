<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
    <style>
        div {
            width: 20rem;
            aspect-ratio: 1;
            background-color: black;
        }

        .change {
            transition: all .5s linear;
            border-radius: 50%;
        }

        .change1 {
            transition: all .5s linear;
            border-radius: 50%;
            translate: -50% 0;
            background-color: blueviolet;
        }

        .change2 {
            transition: all .5s linear;
            border-radius: 50%;
            translate: 50% 0;
            background-color: blueviolet;
        }

        .change3 {
            transition: all .5s linear;
            border-radius: 50%;
            translate: -50% 0;
            background-color: rgb(217, 226, 43);
        }

        .change4 {
            transition: all .5s linear;
            border-radius: 0%;
            background-color: rgb(226, 43, 180);
            translate: 0 0;
        }

        /* practice 2 */
        main{
            width: 50%;
            background-color: rgb(215, 248, 250);
            padding: 10px;
            & p{
                text-align: left;
                font-size: 20px;
                font-family: Arial, Helvetica, sans-serif;
            }
        }
    </style>
</head>

<body>
    <!-- Three ways to attach event -->
    <!--Inline event  -->
    <h1>Inline event</h1>
    <button onclick="alert('hi')">onclick</button>
    <button ondblclick="alert('hi')">ondblclick</button>
    <button onmouseover="alert('hi')">onmouseover</button>
    <!-- DOM event handler-->
    <h1>DOM event handler</h1>
    <button id="btn1">onclick</button>
    <button id="btn2">ondblclick</button>
    <button id="btn3">onmouseover</button>
    <!-- addEventListener event handler-->
    <h1>addEventListener event handler</h1>
    <button id="btne1">onclick</button>
    <button id="btne2">ondblclick</button>
    <button id="btne3">onmouseover</button>

    <!-- Practice 1-->
    <center>
        <h1>practice 1</h1>
        <div></div>
        <button id="change">Click</button>
    </center>

    <!-- practice 2 -->
    <center>
        <h1>practice 2</h1>
        <input type="text" placeholder="enter someting">
        <main>
            <p id="keypress">Key Press </p>
            <p id="keycode">Key Code </p>
            <p id="keycodeat">Key CodeAt </p>
            <p id="eventtype">Event Type </p>
        </main>
    </center>


    <!-- Practice 3 -->
    <center>
        <h1>practice 3</h1>
        <input id="field" type="text" placeholder="enter someting" name="user">
        <main>
            <p id="one">Input Value: </p>
            <p id="two">Input Name: </p>
            <p id="three">Input Type: </p>
            <p id="four">Event Type: </p>
        </main>
    </center>
    <script>
        // DOM event handler
        document.getElementById('btn1').onclick = () => { alert('hi') };
        document.getElementById('btn2').ondblclick = () => { alert('hi') };
        document.getElementById('btn3').onmouseover = () => { alert('hi') };
        // addEventListener event handler
        document.getElementById('btne1').addEventListener('click', () => alert('hi'));
        document.getElementById('btne2').addEventListener('dblclick', () => alert('hi'));
        document.getElementById('btne3').addEventListener('mouseover', () => alert('hi'));
        // Practice
        let btn = document.getElementById('change');
        let div = document.querySelector('div');

        btn.addEventListener('click', () => {
            div.style.backgroundColor = 'green'
        });
        btn.addEventListener('dblclick', () => {
            div.classList.add('change');
        });
        div.addEventListener('mouseover', () => {
            div.classList.add('change1');
        });
        div.addEventListener('mouseout', () => {
            div.classList.add('change2');
        });
        div.addEventListener('mousedown', () => {
            div.classList.add('change3');
        });
        div.addEventListener('mouseup', () => {
            div.classList.add('change4');
        });

        <!-- practice 2 -->
        let input = document.querySelector('input');
        let p1 = document.getElementById('keypress');
        let p2 = document.getElementById('keycode');
        let p3 = document.getElementById('keycodeat');
        let p4 = document.getElementById('eventtype');
                            // keyup
        input.addEventListener('keydown', (event) => {
            console.log(event);

            p1.innerText = `Key Press: ${event.key}`;
            p2.innerText = `Key code:  ${event.code}`;
            p3.innerText = `Key Char code:  ${event.key.charCodeAt(0)}`
            p4.innerText = `Event type:  ${event.type}`;
        });

        <!-- practice 3 -->
        let field = document.querySelector('#field');
        let para1 = document.getElementById('one');
        let para2 = document.getElementById('two');
        let para3 = document.getElementById('three');
        let para4 = document.getElementById('four');
                           
        // field.addEventListener('input', (event) => {
        //     para1.innerText = `Input Value:  ${event.target.value}`;
        //     para2.innerText = `Input Name: ${event.target.name}`;
        //     para3.innerText = `Input Type:  ${event.inputType}`
        //     para4.innerText = `Event Type:  ${event.type}`;
        // });

        field.addEventListener('change', (event) => {
            para1.innerText = `Input Value:  ${event.target.value}`;
            para2.innerText = `Input Name: ${event.target.name}`;
            para3.innerText = `Input Type:  ${event.inputType}`
            para4.innerText = `Event Type:  ${event.type}`;
        });
    </script>
</body>

</html>
