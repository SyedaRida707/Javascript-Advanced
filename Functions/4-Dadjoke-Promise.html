<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DadJoke Poject through API</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: black;
        }

        div {
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: .5rem;
            background-color: white;
            border: 2px solid palevioletred;
            padding: 1rem;
            border-radius: .5rem;
        }

        button {
            padding: 10px 20px;
            background-color: palevioletred;
            border: none;
            border-radius: 1rem;
            color: white;
            transition: .2s all linear;

            &:hover {
                box-shadow: 0px 0px 3px black;
                background-image: linear-gradient(rgb(222, 145, 170), rgb(121, 2, 42));
            }
        }
    </style>
</head>

<body>
    <div>
        <h1>Welcome to Dad Jokes!</h1>
        <p id="api-data"></p>
        <button id="fetchJoke">Get Joke</button>
    </div>

    <script>
        let p = document.querySelector('#api-data');
        let btn = document.querySelector('#fetchJoke')
        // This is actual API
        //  const apiUrl = "https://jsonplaceholder.typicode.com/posts/1";
        // This is actual website
        const apiUrl = "https://icanhazdadjoke.com/"

        const fetchData = () => {
            fetch(apiUrl, {
                headers: {
                    accept: 'application/json'
                }
            }).then((res) => {
                console.log(res);
                return res.json();
            }).then((data) => {
                console.log(data.joke);    
                p.innerHTML = data.joke
            }).catch((error) => {
                console.log("I am sorry");
                p.innerHTML = `Api is not working`;
            })
            btn.innerText = 'Get Another Joke';
        }
        // fetchData();
        btn.addEventListener('click', fetchData);


// Fetch API kya hai?
// JavaScript mein fetch() ka use server/API se data lene ya server ko data bhejne ke liye hota hai.
// Basic syntax: => fetch("API_URL")
// fetch() Promise return karta hai.

// fetch() ke 2 parameters ho sakte hain
// 1 Basic fetch(url)
// 2 Lekin agar request ko customize karna ho, toh second parameter dete hain: fetch(url, options)

// fetch(apiUrl, {
//     headers: {
//         accept: 'application/json'
//     }
// })
// apiUrl → kis API ko request bhejni hai
// { ... } → request ki settings/options

// headers kya hain?
// Headers basically extra information/instructions hoti hain jo hum server ko request ke saath bhejte hain.
// headers: {
//     accept: 'application/json'
// }
// Iska matlab server ko keh rahe ho: "Mujhe response JSON format mein chahiye."
// Accept header ka matlab hota hai:  "Client/server se kis type ka response accept karna chahta hai?"
// accept: 'application/json' (Mujhe JSON response do.)

// Ye headers kyun lagaya?
// Tumhari joke API possibly different response formats support karti ho.
// For example, server ko request mil sakti hai:
// Client → Server

// headers: {
//     accept: 'application/json'

// Server phir JSON response de sakta hai:

// return res.json();
// se us JSON ko JavaScript object mein convert karte ho.

// console.log(data.joke);
// se joke nikal lete ho.

// Promise kya hota hai?
// Abhi result available nahi hai, lekin future mein result milega.
// (Pending → kaam abhi chal raha hai) (Fulfilled → kaam successfully complete) (Rejected → kaam fail ho gaya)

// Example:
// fetch("https://example.com")
// Yahan fetch() turant actual data nahi deta.
// Ye ek Promise deta hai.

// response kya hota hai?
// Jab hum: fetch(url)
// karte hain, toh server se jo response aata hai woh pehle response object hota hai.

// Example:
// fetch("https://jsonplaceholder.typicode.com/users")

// response mein status, headers aur body waghera ki information hoti hai.
// Actual JSON data directly response mein nahi hota.

// response.json() kya karta hai?
// Agar API JSON data return kar rahi hai, toh:
// response.json()
// response ke body ko JavaScript data mein convert karta hai.

// Example:
// fetch("https://jsonplaceholder.typicode.com/users")
//   .then((response) => {
//     return response.json();
//   });

// response.json() bhi Promise return karta hai.
// Isliye hum iske baad ek aur .then() laga sakte hain.

// Iska flow:

// fetch()
//    ↓
// API ko request

// Header: "Mujhe JSON chahiye"

// response.json() ek Promise return karta hai.
// Hum return karte hain taake next .then() us Promise ke result ka wait kare.
// Phir:

// .then((data) => {

// })

// mein actual data mil jata hai.


// fetch()             → Promise return karta hai
// .then()             → successful result handle karta hai
// response            → server ka response
// response.json()     → JSON body ko parse karta hai
// response.json()     → khud bhi Promise return karta hai
// return              → next .then() ko result pass karta hai
// .catch()            → Promise rejection/error handle karta hai

    </script>
</body>

</html>
