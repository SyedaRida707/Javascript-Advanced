<!--* async and await are JavaScript keywords introduced in ECMAScript 2017 (ES8) that make asynchronous 
code look and behave more like synchronous code, making it easier to write, read, and reason about 
asynchronous operations. -->

<!--? async Function Declaration: The async keyword is used to declare an asynchronous function. 
An asynchronous function returns a Promise implicitly, even if the return value is not explicitly 
wrapped in a Promise. Inside an asynchronous function, you can use the await keyword to pause the 
execution of code until a Promise is resolved or rejected. -->

<!--? await Operator: The await keyword is used to pause the execution of an async function until a Promise 
is settled (resolved or rejected). It can only be used inside an async function. When await is used with a 
Promise, it waits for the Promise to resolve and returns the resolved value. If the Promise is rejected, 
it throws an error that can be caught using a try...catch block. -->

<!--* In JavaScript, the try...catch statement is used for error handling. It allows you to catch and handle 
exceptions (errors) that occur within a block of code. Here's how it works:

 < try Block: The try block contains the code that you want to execute. It is the block of code where 
 you anticipate that an error might occur. -->

<!--? catch Block: The catch block follows the try block and is used to catch any exceptions (errors) that 
occur within the try block. If an exception occurs, JavaScript jumps to the catch block to handle the error. 
The catch block takes an error object as a parameter, which can be used to access information about the error, 
such as its message or stack trace. -->

<!--? finally Block (Optional): The finally block, if provided, is executed regardless of whether an error 
occurs or not. It is typically used for cleanup tasks that should always be performed, such as closing resources 
or releasing locks. -->



<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: black;
        }

        div {
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: .5rem;
            background-color: white;
            border: 2px solid palevioletred;
            padding: 1rem;
            border-radius: .5rem;
        }

        button {
            padding: 10px 20px;
            background-color: palevioletred;
            border: none;
            border-radius: 1rem;
            color: white;
            transition: .2s all linear;

            &:hover {
                box-shadow: 0px 0px 3px black;
                background-image: linear-gradient(rgb(222, 145, 170), rgb(121, 2, 42));
            }
        }
    </style>
</head>

<body>
    <div>
        <h1>Welcome to Dad Jokes!</h1>
        <p id="api-data"></p>
        <button id="fetchJoke">Get Joke</button>
    </div>

    <script>
        const apiUrl = "https://icanhazdadjoke.com/"
        let p = document.querySelector('#api-data');
        let btn = document.querySelector('#fetchJoke')

        // async function fetchData() {
        const fetchData = async () => {
            try {
                let res = await fetch(apiUrl, {
                    headers: {
                        Accept: 'application/json'
                    }
                });
                console.log(res);
                let data = await res.json();
                console.log(data);
                console.log(data.joke);
                p.innerHTML = data.joke
            } catch (error) {
                console.log(error);
                p.innerHTML = error
            }
        }
        fetchData();
        btn.addEventListener('click', fetchData)


        // async function ko asynchronous banata hai aur ye automatically Promise return karta hai.
        // await Promise ke result ka wait karta hai.
        // Promise resolve ho to await actual result/value deta hai.
        // Promise reject ho to await error throw karta hai.
        // Error ko try...catch se handle kiya ja sakta hai.
    </script>
</body>

</html>
