<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Watch ⌚</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        div {
            width: 50%;
            height: 40%;
            background-color: transparent;
            border: 2px solid gray;
            border-radius: 10px;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;

            &::after {
                content: '';
                top: 100%;
                left: 30%;
                width: 40%;
                height: 10%;
                background-color: gray;
                position: absolute;
                border-bottom-left-radius: 10px;
                border-bottom-right-radius: 10px;
            }
        }

        p {
            font-size: 4rem;
        }
    </style>
</head>

<body>
    <div>
        <p>hello</p>
    </div>
</body>

</html>
