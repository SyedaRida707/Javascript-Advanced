<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: linear-gradient(#d8b4fe, #9333ea);
            width: 100vw;
            height: 100vh;
        }

        #main {
            margin-block: 20px;
            width: 50%;
            display: flex;
            justify-content: space-around;

            & input {
                width: 50%;
                padding: 10px 20px;
                border: 2px solid black;

                &:focus {
                    outline: 2px solid plum;
                    border: none;
                    border-radius: 5px;
                }
            }

            & button {
                padding: 10px 40px;
                background-color: purple;
                color: white;
                border: none;
                border-radius: 5px;
            }
        }

        #add {
            width: 50%;

            & p {
                color: purple;
                font-size: 17px;
                font-weight: 500;
                background-color: white;
                padding: 10px 20px;
                margin-bottom: 2px;
            }
        }
    </style>
</head>

<body>

    <h1>Todo app</h1>
    <div id="main">
        <input type="text" id="user">
        <button>Save</button>
    </div>
    <div id="add"></div>

    <script>
        let input = document.getElementById('user');
        let btn = document.querySelector('button');
        let div = document.querySelector('#add')

        btn.addEventListener('click', () => {
            // console.log(input.value);
            let p = document.createElement('p');
            p.innerHTML = input.value;
            div.append(p)
            input.value = '';
        });
        div.addEventListener('click', (e) => {
            console.log(e.target);
            e.target.remove();
        });
    </script>
</body>

</html>
