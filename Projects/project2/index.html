<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Gradiant Changer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section>
        <div>
            <button id="btn1">#00ddff</button>
            <button id="btn2">#cd88f5</button>
        </div>
        <h2>Copy code</h2>
        <p>background-image: linear-gradient(to right, rgb(0, 221, 255), rgb(255, 192, 203));</p>
    </section>

    <script>
        let btn1 = document.querySelector('#btn1');
        let btn2 = document.querySelector('#btn2');
        let p = document.querySelector('p');
        let rgb1 = '#00ddff';
        let rgb2 = '#cd88f5';

        let makeColor = () => {
            let rgb = '0123456789ABCDEF';
            let color = '#'
            for (let i = 0; i < 6; i++) {
                // console.log(rgb1[Math.floor(Math.random() * 16)]);
                color += rgb[Math.floor(Math.random() * 16)];
            }
            return color;
        }
        btn1.addEventListener('click', () => {
            rgb1 = makeColor();
            p.innerText = `background-image: linear-gradient(to right,${rgb1}, ${rgb2});`
            document.body.style.backgroundImage = `linear-gradient(to right,${rgb1},  ${rgb2})`
            btn1.innerText = rgb1
            console.log(rgb1);

        });

        btn2.addEventListener('click', () => {
            rgb2 = makeColor();
            p.innerText = `background-image: linear-gradient(to right,${rgb1}, ${rgb2});`
            document.body.style.backgroundImage = `linear-gradient(to right,${rgb1},  ${rgb2})`
            btn1.innerText = rgb2;
            console.log(rgb2);
        });

        p.addEventListener('click', () => {
            navigator.clipboard.writeText(p.innerText)
            alert('Copy your code ' + '\n' + p.innerText)
            p.previousElementSibling.innerText = 'Copied'
        });

    </script>
</body>

</html>
