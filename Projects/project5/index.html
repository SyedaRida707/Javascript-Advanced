<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Watch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        main {
            width: 40%;
            background-color: black;
            padding: 50px;
        }

        #innerValue {
            color: white;
            text-align: center;
            font-size: 80px;
        }

        #btns {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        button {
            width: 40%;
            padding: 5px 20px;
            border-radius: 10px;
            border: none;
            background-color: white;
            font-size: 17px;
            text-transform: capitalize;

            &:hover {
                border: 2px solid black;
                box-shadow: 0px 0px 9px 4px white;
            }
        }

        #getValue {
            color: red;
            text-align: center;
            padding-block: 10px;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>

<body>
    <main>
        <p id="innerValue">0</p>
        <div id="btns">
            <button id="start">start</button>
            <button id="stop">stop</button>
            <button id="reset">reset</button>
            <button id="getTime">get Time</button>
            <button id="clearValue">clear Value</button>
        </div>
        <div id="getValue"></div>
    </main>

    <script>
        let p = document.querySelector('#innerValue');
        let p2 = document.querySelector('#getValue');
        let count = 0;
        let intervall;
        // start
        document.querySelector('#start').addEventListener('click', () => {
            intervall = setInterval(() => {
                p.innerText = count++;
            }, 1000);
        });
        // stop
        document.querySelector('#stop').addEventListener('click', () => {
            clearInterval(intervall);
        });
        // reset
        document.querySelector('#reset').addEventListener('click', () => {
            count = 0;
            p.innerHTML = count;
            clearInterval(intervall);
        });
        // value get
        document.querySelector('#getTime').addEventListener('click', () => {
            let para = document.createElement('p');

            para.innerText = `The Stop time is ${count - 1}`;
            p2.append(para)
        });
        // value reset
        document.querySelector('#clearValue').addEventListener('click', () => {
            p2.innerHTML = '';
        });
    </script>
</body>

</html>
