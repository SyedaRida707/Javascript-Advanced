<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>weather app</title>
</head>

<body>
    <section class="container">
        <!-- input field search  -->
        <div class="weather_header">
            <form class="weather_search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" class="city_name" placeholder="search your city...">
            </form>
        </div>
        <!-- weather main data -->
        <div class="weather_body">
            <div class="city-data">
                <h1 class="weather_city">karachi</h1>
                <p class="weather_date_time">time</p>
            </div>

            <div class="weather_data">
                <p class="weather_forecast">Cloud</p>
                <div class="weather_icon">icon</div>
            </div>

            <p class="weather_temperature">234</p>
            <div class="weather_minmax">
                <p class="weather_min"> temprature</p>
                <p class="weather_max">temprature</p>
            </div>
        </div>

        <!-- weather extra data  -->
        <section class="weather_info">
            <div class="weather_card">
                <i class="fa-solid fa-droplet"></i>
                <div>
                    <p>Feels Like</p>
                    <p class="weather_feelsLike">15&#176</p>
                </div>
            </div>

            <div class="weather_card">
                <i class="fa-solid fa-droplet"></i>
                <div>
                    <p>Humidity</p>
                    <p class="weather_humidity">15&#176</p>
                </div>
            </div>

            <div class="weather_card">
                <i class="fa-solid fa-wind"></i>
                <div>
                    <p>Wind</p>
                    <p class="weather_wind">15&#176</p>
                </div>
            </div>

            <div class="weather_card">
                <i class="fa-solid fa-gauge-high"></i>
                <div>
                    <p>Pressure</p>
                    <p class="weather_pressure">15&#176</p>
                </div>
            </div>
        </section>

        <script src="https://kit.fontawesome.com/d64bc55ce9.js" crossorigin="anonymous"></script>
        <script src="app.js"></script>
</body>

</html>
